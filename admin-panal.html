        async function mockRequest(method, path, body = {}) {
            await new Promise(r => setTimeout(r, 40));
            const [p, qs] = path.split('?');
            const q = Object.fromEntries(new URLSearchParams(qs || ''));
            let m;

            if (method === 'GET' && p === '/admin/dashboard') {
                const revenue = DB.orders.filter(o => ['PAID','APPROVED','SHIPPED','DELIVERED'].includes(o.status)).reduce((s, o) => s + Number(o.total || 0), 0);
                const counts = { orders: DB.orders.length, users: DB.users.length, affiliates: DB.affiliates.length, pendingFeedback: DB.feedback.filter(f => f.status !== 'ACCEPTED' && f.status !== 'REJECTED').length, activeSessions: DB.sessions.filter(s => s.status !== 'CLOSED').length };
                const recentOrders = [...DB.orders].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 8);
                return { counts, revenue, recentOrders };
            }

            if (method === 'GET' && p === '/admin/products') return { items: DB.products };
            if (method === 'POST' && p === '/admin/products') { const prod = { id: uid(), createdAt: new Date().toISOString(), ...body }; DB.products.push(prod); saveDB(); return { product: prod }; }
            if (method === 'PUT' && (m = p.match(/^\/admin\/products\/([^/]+)$/))) { const i = DB.products.findIndex(x => x.id === m[1]); if (i < 0) throw new Error('Product not found'); DB.products[i] = { ...DB.products[i], ...body }; saveDB(); return { product: DB.products[i] }; }
            if (method === 'DELETE' && (m = p.match(/^\/admin\/products\/([^/]+)$/))) { const i = DB.products.findIndex(x => x.id === m[1]); if (i < 0) throw new Error('Product not found'); const sku = DB.products[i].sku; const hasOrders = DB.orders.some(o => o.items.some(it => it.sku === sku)); if (hasOrders) { DB.products[i].isActive = false; saveDB(); return { softDeleted: true, message: 'Product deactivated (has orders)' }; } DB.products.splice(i, 1); saveDB(); return { deleted: true }; }

            if (method === 'GET' && p === '/admin/orders') return { orders: DB.orders };
            if (method === 'GET' && (m = p.match(/^\/admin\/orders\/([^/]+)$/))) { const o = DB.orders.find(x => x.id === m[1]); if (!o) throw new Error('Order not found'); return { order: o }; }
            if (method === 'POST' && (m = p.match(/^\/admin\/orders\/([^/]+)\/approve$/))) { const o = DB.orders.find(x => x.id === m[1]); if (!o) throw new Error('Order not found'); o.status = 'APPROVED'; saveDB(); const cjForward = { orderNumber: o.orderNumber, shippingAddress: o.shippingAddress, items: o.items.map(it => { const prod = DB.products.find(pr => pr.id === it.productId || pr.sku === it.sku); return { sku: it.sku, pid: prod?.pid || '(unset)', name: it.name, quantity: it.quantity, variant: it.variantJson || null }; }) }; return { cjForward }; }
            if (method === 'POST' && (m = p.match(/^\/admin\/orders\/([^/]+)\/reject$/))) { const o = DB.orders.find(x => x.id === m[1]); if (!o) throw new Error('Order not found'); o.status = 'REJECTED'; o.rejectReason = body.reason || ''; saveDB(); return { ok: true }; }
            if (method === 'POST' && (m = p.match(/^\/admin\/orders\/([^/]+)\/ship$/))) { const o = DB.orders.find(x => x.id === m[1]); if (!o) throw new Error('Order not found'); o.status = 'SHIPPED'; o.trackingNumber = body.trackingNumber; o.trackingCarrier = body.trackingCarrier || ''; saveDB(); return { ok: true }; }
            if (method === 'POST' && (m = p.match(/^\/admin\/orders\/([^/]+)\/deliver$/))) { const o = DB.orders.find(x => x.id === m[1]); if (!o) throw new Error('Order not found'); o.status = 'DELIVERED'; saveDB(); return { ok: true }; }

            if (method === 'GET' && p === '/admin/affiliates') return { items: DB.affiliates };
            if (method === 'PUT' && (m = p.match(/^\/admin\/affiliates\/([^/]+)$/))) { const i = DB.affiliates.findIndex(x => x.id === m[1]); if (i < 0) throw new Error('Affiliate not found'); DB.affiliates[i] = { ...DB.affiliates[i], ...body }; saveDB(); return { affiliate: DB.affiliates[i] }; }

            if (method === 'GET' && p === '/admin/feedback') return { items: DB.feedback };
            if (method === 'POST' && (m = p.match(/^\/admin\/feedback\/([^/]+)\/review$/))) { const f = DB.feedback.find(x => x.id === m[1]); if (!f) throw new Error('Feedback not found'); if (body.level !== undefined) f.level = body.level; if (body.status !== undefined) f.status = body.status; if (body.adminNote !== undefined) f.adminNote = body.adminNote; saveDB(); return { feedback: f }; }

            if (method === 'GET' && p === '/admin/ai-knowledge') return { items: DB.aiKnowledge };
            if (method === 'POST' && p === '/admin/ai-knowledge') { const k = { id: uid(), ...body }; DB.aiKnowledge.push(k); saveDB(); return { entry: k }; }
            if (method === 'PUT' && (m = p.match(/^\/admin\/ai-knowledge\/([^/]+)$/))) { const i = DB.aiKnowledge.findIndex(x => x.id === m[1]); if (i < 0) throw new Error('Entry not found'); DB.aiKnowledge[i] = { ...DB.aiKnowledge[i], ...body }; saveDB(); return { entry: DB.aiKnowledge[i] }; }
            if (method === 'DELETE' && (m = p.match(/^\/admin\/ai-knowledge\/([^/]+)$/))) { DB.aiKnowledge = DB.aiKnowledge.filter(x => x.id !== m[1]); saveDB(); return { ok: true }; }

            if (method === 'GET' && p === '/admin/email-providers') return { items: DB.emailProviders };
            if (method === 'POST' && p === '/admin/email-providers') { const ep = { id: uid(), ...body }; DB.emailProviders.push(ep); saveDB(); return { provider: ep }; }
            if (method === 'PUT' && (m = p.match(/^\/admin\/email-providers\/([^/]+)$/))) { const i = DB.emailProviders.findIndex(x => x.id === m[1]); if (i < 0) throw new Error('Provider not found'); DB.emailProviders[i] = { ...DB.emailProviders[i], ...body }; saveDB(); return { provider: DB.emailProviders[i] }; }
            if (method === 'DELETE' && (m = p.match(/^\/admin\/email-providers\/([^/]+)$/))) { DB.emailProviders = DB.emailProviders.filter(x => x.id !== m[1]); saveDB(); return { ok: true }; }

            if (method === 'GET' && p === '/admin/support-settings') return { settings: DB.supportSettings };
            if (method === 'PUT' && p === '/admin/support-settings') { DB.supportSettings = { ...DB.supportSettings, ...body }; saveDB(); return { settings: DB.supportSettings }; }

            if (method === 'GET' && p === '/support/admin/sessions') { let sessions = DB.sessions; if (q.status && q.status !== 'ALL') sessions = sessions.filter(s => s.status === q.status); return { sessions }; }
            if (method === 'POST' && (m = p.match(/^\/support\/admin\/session\/([^/]+)\/join$/))) { const s = DB.sessions.find(x => x.id === m[1]); if (!s) throw new Error('Session not found'); s.status = 'ACTIVE'; saveDB(); return { ok: true }; }
            if (method === 'POST' && (m = p.match(/^\/support\/admin\/session\/([^/]+)\/close$/))) { const s = DB.sessions.find(x => x.id === m[1]); if (!s) throw new Error('Session not found'); s.status = 'CLOSED'; s.messages = s.messages || []; s.messages.push({ sender: 'system', message: 'Session closed by admin.', timestamp: new Date().toISOString() }); s.updatedAt = new Date().toISOString(); saveDB(); return { ok: true }; }
            if (method === 'POST' && (m = p.match(/^\/support\/session\/([^/]+)\/message$/))) { const s = DB.sessions.find(x => x.id === m[1]); if (!s) throw new Error('Session not found'); s.messages = s.messages || []; s.messages.push({ sender: body.sender || 'admin', message: body.message, timestamp: new Date().toISOString() }); s.updatedAt = new Date().toISOString(); saveDB(); return { ok: true }; }

            if (method === 'GET' && p === '/admin/settings/homepage') return { ids: DB.homepageIds };
            if (method === 'PUT' && p === '/admin/settings/homepage') { DB.homepageIds = body.ids || []; saveDB(); return { ok: true }; }

            if (method === 'GET' && p === '/admin/users') return { items: DB.users };
            if (method === 'PUT' && (m = p.match(/^\/admin\/users\/([^/]+)\/role$/))) { const u = DB.users.find(x => x.id === m[1]); if (!u) throw new Error('User not found'); u.role = body.role; saveDB(); return { user: u }; }

            throw new Error('Mock 404: ' + method + ' ' + path);
        }

        const api = {
            get:  (path)       => mockRequest('GET', path),
            post: (path, body) => mockRequest('POST', path, body),
            put:  (path, body) => mockRequest('PUT', path, body),
            del:  (path)       => mockRequest('DELETE', path)
        };

        window.FiadAPI = { api, toast, escapeHtml };
    })();
    </script>

    <!-- ==================== ADMIN LOGIC ==================== -->
    <script>
    (function () {
        const { api, toast, escapeHtml } = window.FiadAPI;

        // ---- sections registry declared FIRST to avoid TDZ ----
        const sections = {};

        // ---- helpers ----
        function openModal(html, opts = {}) {
            const backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop fixed inset-0 z-[95] bg-black/50 flex items-center justify-center p-4 overflow-y-auto';
            backdrop.innerHTML = `<div class="admin-card bg-white dark:bg-zinc-900 rounded-xl w-full ${opts.width || 'max-w-lg'} my-8 max-h-[90vh] overflow-y-auto">${html}</div>`;
            document.getElementById('modal-root').appendChild(backdrop);
            const close = () => backdrop.remove();
            backdrop.addEventListener('click', (e) => { if (e.target === backdrop && opts.closeOnBackdrop !== false) close(); });
            backdrop.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
            return { el: backdrop, close };
        }
        function money(n) { return '$' + Number(n || 0).toFixed(2); }
        function fmt(d) { return d ? new Date(d).toLocaleString() : '—'; }

        // ============================================================================
        // DASHBOARD
        // ============================================================================
        sections.dashboard = async (root) => {
            const { counts, revenue, recentOrders } = await api.get('/admin/dashboard');
            const stat = (label, val, icon, color) => `
                <div class="admin-card bg-white dark:bg-zinc-900 rounded-xl p-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-${color}-100 dark:bg-${color}-900/30 text-${color}-600 dark:text-${color}-400 flex items-center justify-center">
                            <i class="fa-solid ${icon}"></i>
                        </div>
                        <div>
                            <p class="text-[10px] uppercase tracking-widest text-gray-600">${label}</p>
                            <p class="text-xl font-bold">${val}</p>
                        </div>
                    </div>
                </div>`;
            root.innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
                    ${stat('Orders',         counts.orders,          'fa-cart-shopping', 'cta')}
                    ${stat('Revenue',        money(revenue),         'fa-dollar-sign',   'green')}
                    ${stat('Users',          counts.users,           'fa-users',         'blue')}
                    ${stat('Affiliates',     counts.affiliates,      'fa-user-group',    'purple')}
                    ${stat('Feedback',       counts.pendingFeedback, 'fa-comment-dots',  'yellow')}
                    ${stat('Live Sessions',  counts.activeSessions,  'fa-headset',       'red')}
                </div>
                <div class="admin-card bg-white dark:bg-zinc-900 rounded-xl p-5">
                    <h3 class="text-sm font-bold mb-3">Recent orders</h3>
                    <div class="overflow-x-auto">
                    <table class="data">
                        <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
                        <tbody>
                        ${recentOrders.map(o => `
                            <tr>
                                <td class="font-semibold"><a class="text-cta-500 hover:underline" href="#orders">${escapeHtml(o.orderNumber)}</a></td>
                                <td class="text-gray-600">${escapeHtml(o.user?.email || o.guestEmail || 'Registered user')}</td>
                                <td class="font-bold">${money(o.total)}</td>
                                <td><span class="status-pill status-${o.status}">${o.status}</span></td>
                                <td class="text-gray-600">${fmt(o.createdAt)}</td>
                            </tr>`).join('') || '<tr><td colspan="5" class="text-center text-gray-600 py-6">No orders yet.</td></tr>'}
                        </tbody>
                    </table>
                    </div>
                </div>`;
        };

        // ============================================================================
        // PRODUCTS
        // ============================================================================
        let _allProductsCache = [];
        async function getAllProductsForPackage() {
            try {
                if (_allProductsCache.length) return _allProductsCache;
                const { items } = await api.get('/admin/products');
                _allProductsCache = items;
                return items;
            } catch { return []; }
        }

        sections.products = async (root) => {
            const { items } = await api.get('/admin/products');
            root.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <p class="text-sm text-gray-600">${items.length} products</p>
                    <button id="new-product" class="bg-cta-500 hover:bg-cta-600 text-white text-sm font-bold px-4 py-2 rounded-lg"><i class="fa-solid fa-plus mr-1"></i>New product</button>
                </div>
                <div class="admin-card bg-white dark:bg-zinc-900 rounded-xl overflow-hidden">
                    <div class="overflow-x-auto">
                    <table class="data">
                        <thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Commission</th><th>Status</th><th></th></tr></thead>
                        <tbody>
                        ${items.map(p => `
                            <tr>
                                <td>
                                    <div class="flex items-center gap-2">
                                        <img src="${(p.images && p.images[0]) || 'https://placehold.co/60'}" class="w-9 h-9 rounded object-cover">
                                        <div class="min-w-0">
                                            <div class="font-semibold truncate">${escapeHtml(p.name)}</div>
                                            <div class="text-[10px] text-gray-600">${p.isProMode ? '<span class="text-cta-500">Pro Mode</span> · ' : ''}${p.isPackage ? 'Package · ' : ''}${(p.variants || []).length} variants</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="font-mono text-[11px]">${escapeHtml(p.sku)}</td>
                                <td>${escapeHtml(p.category)}</td>
                                <td class="font-bold">${money(p.basePrice)}</td>
                                <td>${Number(p.affiliateCommission || 0)}%</td>
                                <td>${p.isActive ? '<span class="text-green-600 text-xs font-bold">Active</span>' : '<span class="text-gray-600 text-xs">Inactive</span>'}</td>
                                <td class="text-right whitespace-nowrap">
                                    <button data-edit="${p.id}" class="text-cta-500 hover:text-cta-600 px-2"><i class="fa-solid fa-pen"></i></button>
                                    <button data-del="${p.id}" class="text-red-500 hover:text-red-600 px-2"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>`).join('') || '<tr><td colspan="7" class="text-center text-gray-600 py-6">No products yet.</td></tr>'}
                        </tbody>
                    </table>
                    </div>
                </div>`;

            document.getElementById('new-product').addEventListener('click', () => productModal(null));
            root.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
                const p = items.find(i => i.id === b.getAttribute('data-edit'));
                productModal(p);
            }));
            root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
                if (!confirm('Delete this product? If it has orders, it will be deactivated instead of deleted.')) return;
                try {
                    const res = await api.del('/admin/products/' + b.getAttribute('data-del'));
                    if (res.softDeleted) toast(res.message || 'Product deactivated (has orders)', 'info');
                    else toast('Deleted', 'success');
                    _allProductsCache = [];
                    sections.products(root);
                } catch (e) { toast(e.message, 'error'); }
            }));
        };

        function productModal(p) {
            const isEdit = !!p;
            const existingPkgItems = p?.packageItems || [];
            const { close, el } = openModal(`
                <div class="p-6 max-h-[90vh] overflow-y-auto">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg">${isEdit ? 'Edit product' : 'New product'}</h3>
                        <button data-close class="text-gray-600 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div><label class="text-xs font-medium mb-1 block">SKU *</label><input id="p-sku" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700" value="${escapeHtml(p?.sku || '')}"></div>
                        <div><label class="text-xs font-medium mb-1 block">CJ PID *</label><input id="p-pid" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700" value="${escapeHtml(p?.pid || '')}"></div>
                        <div class="col-span-2"><label class="text-xs font-medium mb-1 block">Name *</label><input id="p-name" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700" value="${escapeHtml(p?.name || '')}"></div>
                        <div class="col-span-2"><label class="text-xs font-medium mb-1 block">Description *</label><textarea id="p-desc" rows="3" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700">${escapeHtml(p?.description || '')}</textarea></div>
                        <div><label class="text-xs font-medium mb-1 block">Category *</label><input id="p-cat" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700" value="${escapeHtml(p?.category || '')}"></div>
                        <div><label class="text-xs font-medium mb-1 block">Base price ($) *</label><input id="p-price" type="number" step="0.01" min="0" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700" value="${p?.basePrice || 0}"></div>
                        <div><label class="text-xs font-medium mb-1 block">Affiliate commission (%)</label><input id="p-comm" type="number" step="0.5" min="0" max="90" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700" value="${p?.affiliateCommission || 0}"></div>
                        <div><label class="text-xs font-medium mb-1 block">Stock</label><input id="p-stock" type="number" min="0" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700" value="${p?.stock || 0}"></div>
                        <div class="col-span-2"><label class="text-xs font-medium mb-1 block">Image URLs (one per line) *</label><textarea id="p-imgs" rows="3" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700">${escapeHtml((p?.images || []).join('\n'))}</textarea></div>
                        <div class="col-span-2"><label class="text-xs font-medium mb-1 block">Video URLs (one per line, max 10)</label><textarea id="p-vids" rows="3" class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700">${escapeHtml((p?.videos || []).join('\n'))}</textarea></div>
                        <div class="col-span-2 flex gap-4">
                            <label class="text-xs flex items-center gap-2"><input id="p-active" type="checkbox" ${p?.isActive !== false ? 'checked' : ''} class="accent-cta-500"> Active</label>
                            <label class="text-xs flex items-center gap-2"><input id="p-pro" type="checkbox" ${p?.isProMode ? 'checked' : ''} class="accent-cta-500"> Pro Mode</label>
                            <label class="text-xs flex items-center gap-2"><input id="p-pkg" type="checkbox" ${p?.isPackage ? 'checked' : ''} class="accent-cta-500"> Is Package</label>
                        </div>

                        <div id="pkg-builder" class="col-span-2 ${p?.isPackage ? '' : 'hidden'} border border-dashed border-cta-300 dark:border-cta-700 rounded-lg p-3 bg-cta-50/30 dark:bg-cta-950/20">
                            <h4 class="text-xs font-bold mb-2 flex items-center gap-1"><i class="fa-solid fa-box-open text-cta-500"></i> Package Builder</h4>
                            <p class="text-[11px] text-gray-600 mb-2">Select products and set quantity.</p>
                            <div id="pkg-items-list" class="space-y-2 mb-3"></div>
                            <div class="flex gap-2">
                                <select id="pkg-product-select" class="flex-1 px-2 py-1.5 border rounded bg-white dark:bg-zinc-900 border-gray-300 dark:border-zinc-700 text-[11px]">
                                    <option value="">Select product to add...</option>
                                </select>
                                <input id="pkg-qty" type="number" min="1" value="1" class="w-20 px-2 py-1.5 border rounded bg-white dark:bg-zinc-900 border-gray-300 dark:border-zinc-700 text-[11px]" placeholder="Qty">
                                <button type="button" id="pkg-add-btn" class="px-3 py-1.5 bg-cta-500 hover:bg-cta-600 text-white rounded text-[11px] font-bold">Add</button>
                            </div>
                            <details class="mt-3">
                                <summary class="text-[11px] font-medium cursor-pointer text-gray-600">Advanced: Edit as JSON</summary>
                                <textarea id="p-pkg-items" rows="3" placeholder='[{"childProductId":"abc123","quantity":2}]' class="mt-2 w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700 font-mono text-[11px]"></textarea>
                            </details>
                        </div>

                        <div class="col-span-2">
                            <label class="text-xs font-medium mb-1 block">Variants (JSON array, optional)</label>
                            <textarea id="p-var" rows="3" placeholder='[{"color":"Black","size":"M","stock":10}]' class="w-full px-3 py-2 border rounded bg-transparent border-gray-300 dark:border-zinc-700 font-mono text-[11px]">${escapeHtml(JSON.stringify(p?.variants || [], null, 2))}</textarea>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-5">
                        <button data-close class="flex-1 py-2.5 border border-gray-300 dark:border-zinc-700 rounded-lg text-sm">Cancel</button>
                        <button id="p-save" class="flex-1 py-2.5 bg-cta-500 hover:bg-cta-600 text-white rounded-lg text-sm font-bold">${isEdit ? 'Save changes' : 'Create product'}</button>
                    </div>
                </div>`, { width: 'max-w-2xl' });

            let pkgItems = JSON.parse(JSON.stringify(existingPkgItems.map(pi => ({ childProductId: pi.childProductId || pi.childProduct?.id, quantity: pi.quantity, _name: pi.childProduct?.name || '' }))));

            (async () => {
                const all = await getAllProductsForPackage();
                pkgItems.forEach(pi => { if (!pi._name) { const found = all.find(x => x.id === pi.childProductId); if (found) pi._name = found.name; } });
                renderPkgList();
            })();

            async function refreshPkgDropdown() {
                const all = await getAllProductsForPackage();
                const sel = el.querySelector('#pkg-product-select');
                if (!sel) return;
                const currentIds = new Set(pkgItems.map(i => i.childProductId));
                const options = all.filter(prod => prod.id !== p?.id).map(prod =>
                    `<option value="${prod.id}" ${currentIds.has(prod.id) ? 'disabled' : ''}>${escapeHtml(prod.name)} — ${prod.sku} (${money(prod.basePrice)})</option>`
                ).join('');
                sel.innerHTML = '<option value="">Select product to add...</option>' + options;
            }

            function renderPkgList() {
                const list = el.querySelector('#pkg-items-list');
                if (!list) return;
                if (pkgItems.length === 0) { list.innerHTML = '<p class="text-[11px] text-gray-600 italic">No items yet. Add from dropdown below.</p>'; return; }
                list.innerHTML = pkgItems.map((pi, idx) => `
                    <div class="flex items-center gap-2 bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded px-2 py-1.5">
                        <span class="text-[11px] flex-1 truncate">${escapeHtml(pi._name || pi.childProductId)}</span>
                        <input type="number" min="1" value="${pi.quantity || 1}" data-qty="${idx}" class="w-16 px-1 py-0.5 border rounded text-[11px] bg-transparent border-gray-300 dark:border-zinc-700">
                        <button type="button" data-remove-pkg="${idx}" class="text-red-500 hover:text-red-600 px-1"><i class="fa-solid fa-xmark text-[11px]"></i></button>
                    </div>
                `).join('');
                list.querySelectorAll('[data-qty]').forEach(inp => inp.addEventListener('change', (e) => { const i = Number(e.target.getAttribute('data-qty')); pkgItems[i].quantity = Math.max(1, Number(e.target.value) || 1); syncPkgJson(); }));
                list.querySelectorAll('[data-remove-pkg]').forEach(btn => btn.addEventListener('click', (e) => { const i = Number(e.currentTarget.getAttribute('data-remove-pkg')); pkgItems.splice(i, 1); renderPkgList(); syncPkgJson(); }));
            }

            function syncPkgJson() {
                const ta = el.querySelector('#p-pkg-items');
                if (ta) ta.value = JSON.stringify(pkgItems.map(pi => ({ childProductId: pi.childProductId, quantity: pi.quantity })), null, 2);
            }

            const pkgCheck = el.querySelector('#p-pkg');
            const pkgBuilder = el.querySelector('#pkg-builder');
            if (pkgCheck && pkgBuilder) {
                pkgCheck.addEventListener('change', () => pkgBuilder.classList.toggle('hidden', !pkgCheck.checked));
            }

            el.querySelector('#pkg-add-btn')?.addEventListener('click', async () => {
                const sel = el.querySelector('#pkg-product-select');
                const qtyInput = el.querySelector('#pkg-qty');
                const childId = sel?.value;
                const qty = Math.max(1, Number(qtyInput?.value) || 1);
                if (!childId) return toast('Select a product', 'warn');
                if (pkgItems.some(i => i.childProductId === childId)) return toast('Already added', 'warn');
                const all = await getAllProductsForPackage();
                const prod = all.find(x => x.id === childId);
                pkgItems.push({ childProductId: childId, quantity: qty, _name: prod?.name || childId });
                renderPkgList(); syncPkgJson(); await refreshPkgDropdown();
                if (qtyInput) qtyInput.value = '1';
            });

            refreshPkgDropdown();
            syncPkgJson();

            el.querySelector('#p-pkg-items')?.addEventListener('change', (e) => {
                try {
                    const parsed = JSON.parse(e.target.value || '[]');
                    if (Array.isArray(parsed)) {
                        getAllProductsForPackage().then(all => {
                            pkgItems = parsed.map(pi => { const found = all.find(x => x.id === pi.childProductId); return { childProductId: pi.childProductId, quantity: pi.quantity, _name: found?.name || pi.childProductId }; });
                            renderPkgList();
                        });
                    }
                } catch { toast('Package JSON invalid', 'error'); }
            });

        document.getElementById('admin-name').textContent = 'Hi, Admin';

        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm('Reset all demo data to defaults?')) window.__FIAD_RESET__();
        });
        document.getElementById('mobile-sidebar-toggle').addEventListener('click', () =>
            document.getElementById('sidebar').classList.toggle('open'));

        // dark mode
        (function initTheme() {
            const isDark = localStorage.getItem('fiadshop_theme') === 'dark';
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').textContent = '☀️';
            }
            document.getElementById('dark-mode-toggle').addEventListener('click', () => {
                const nowDark = document.documentElement.classList.toggle('dark');
                document.getElementById('theme-icon').textContent = nowDark ? '☀️' : '🌙';
                try { localStorage.setItem('fiadshop_theme', nowDark ? 'dark' : 'light'); } catch {}
            });
        })();

        // start router LAST
        initRouter();
    })();
    </script>
</body>
</html>
