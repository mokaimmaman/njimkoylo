# Template: copy to .github/workflows/ to enable automatic rebuilds.
name: Rebuild Product CSVs and Per-SKU Detail Files

on:
  workflow_dispatch:
  push:
    paths:
      - "data/three_groups_products.csv"
      - "data/three_groups_products_cleaned.csv"
      - "output/three_groups_products_cleaned.csv"
      - "build_products_csv.py"
      - "build_product_detail_csvs.py"
      - "sku_codec.py"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild catalog and per-SKU detail CSVs
        run: |
          python3 build_products_csv.py
          python3 build_product_detail_csvs.py

      - name: Commit rebuilt CSVs if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/products.csv data/products; then
            echo "Product CSVs are already up to date."
            exit 0
          fi
          git add data/products.csv data/products
          git commit -m "Rebuild product CSVs and per-SKU detail files"
          git push
